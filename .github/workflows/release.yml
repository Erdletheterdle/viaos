# Push a tag `v<N>` where N is the number in VERSION: builds both
# architectures, signs the OS updates, and publishes them and the base images
# to your control plane. Needs repository secrets:
#
#   VIA_SERVER       https://via.example.com
#   VIA_TOKEN        an admin token: `via-server token create ci`
#   VIA_SIGNING_KEY  the contents of ~/.config/via/signing.key
#   VIA_SECURE_BOOT_KEYS  `tar -C ~/.config/via/secure-boot -c . | base64 -w0`
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      # An image build needs more disk than a runner has free.
      - uses: jlumbroso/free-disk-space@main
      - uses: cachix/install-nix-action@v31
      # systemd-repart builds the image in a user namespace, which Ubuntu's
      # AppArmor policy forbids by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix build .#via -o via
      - run: nix build .#images.${{ matrix.arch }} -o image
      - run: nix build .#updates.${{ matrix.arch }} -o update
      - name: Publish
        env:
          VIA_SERVER: ${{ secrets.VIA_SERVER }}
          VIA_TOKEN: ${{ secrets.VIA_TOKEN }}
          VIA_SIGNING_KEY_HEX: ${{ secrets.VIA_SIGNING_KEY }}
          SECURE_BOOT_TAR: ${{ secrets.VIA_SECURE_BOOT_KEYS }}
        run: |
          umask 077
          printf '%s\n' "$VIA_SIGNING_KEY_HEX" > "$RUNNER_TEMP/key"
          # Not optional: a runner making its own keys would sign with ones no device has.
          mkdir "$RUNNER_TEMP/sb"
          printf '%s' "${SECURE_BOOT_TAR:?set the VIA_SECURE_BOOT_KEYS secret}" | base64 -d | tar -C "$RUNNER_TEMP/sb" -x
          export VIA_SECURE_BOOT_KEYS="$RUNNER_TEMP/sb"
          via/bin/via os-release update --sign-key "$RUNNER_TEMP/key"
          via/bin/via base-image image/viaos_$(cat VERSION).raw --arch ${{ matrix.arch }}
          rm -rf "$RUNNER_TEMP/key" "$RUNNER_TEMP/sb"
